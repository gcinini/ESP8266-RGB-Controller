; PlatformIO configuration.
; The sketch stays in ESP8266-RGB-Web-Server/ so the Arduino IDE can still open it;
; src_dir and data_dir point PlatformIO at that same folder.

[platformio]
src_dir = ESP8266-RGB-Web-Server
data_dir = ESP8266-RGB-Web-Server/data
default_envs = d1_mini

; Settings shared by every environment
[env]
platform = espressif8266
board = d1_mini
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200
lib_deps =
    fastled/FastLED@^3.7.0
    knolleary/PubSubClient@^2.8

; Upload over USB
[env:d1_mini]
upload_speed = 921600

; Upload over Wi-Fi (OTA). Use the lamp's IP address instead if lightbox1.local doesn't resolve.
[env:d1_mini_ota]
upload_protocol = espota
upload_port = lightbox1.local
