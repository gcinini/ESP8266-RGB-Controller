; PlatformIO configuration.
; The sketch stays in ESP8266-RGB-Web-Server/ so the Arduino IDE can still open it;
; src_dir points PlatformIO at that same folder.

[platformio]
src_dir = ESP8266-RGB-Web-Server
default_envs = d1_mini

; Settings shared by every environment
[env]
platform = espressif8266
board = d1_mini
framework = arduino
board_build.f_cpu = 160000000L   ; 160 MHz: the encrypted Adafruit IO connection sets up about twice as fast
monitor_speed = 115200
monitor_filters = esp8266_exception_decoder
lib_deps =
    fastled/FastLED@3.10.9
    knolleary/PubSubClient@^2.8

; Upload over USB
[env:d1_mini]
upload_speed = 921600

; Upload over Wi-Fi (OTA).
; upload_port: the lamp's IP address (shown on its web page under Network). A .local
;   name only works when the PC and the lamp are on the same network/VLAN.
; OTA traffic: the PC sends an invitation to the lamp on UDP 8266, then the lamp
;   connects back to the PC on TCP 8270 (fixed below so a firewall rule can allow it).
; If you set OTA_PASSWORD in secrets.h, put the same password in the
;   LIGHTBOX_OTA_PASSWORD environment variable and remove the ";" before --auth.
[env:d1_mini_ota]
upload_protocol = espota
upload_port = 192.168.30.30
upload_flags =
    --host_port=8270
    --auth=${sysenv.LIGHTBOX_OTA_PASSWORD}
