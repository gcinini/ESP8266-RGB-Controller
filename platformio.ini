; PlatformIO configuration (the file VS Code's PlatformIO extension reads).
;
; Lines starting with ; are comments. A [section] starting with "env:" is an
; *environment*: one way of building and uploading. Pick one in the PlatformIO
; toolbar, or with  pio run -e <name> -t upload
;
; The sketch stays in ESP8266-RGB-Web-Server/ so the Arduino IDE can still
; open it; src_dir points PlatformIO at that same folder.
;
; Each lamp has its own environments. build_flags = -D LAMP_ID=n tells the
; code which block of settings in config.h to use - it's the same as writing
; #define LAMP_ID n at the top of config.h.

[platformio]
src_dir = ESP8266-RGB-Web-Server
default_envs = d1_mini

; ---------------------------------------------------------------------------
; Settings shared by every environment
; ---------------------------------------------------------------------------
[env]
platform = espressif8266
board = d1_mini
framework = arduino
board_build.f_cpu = 160000000L   ; 160 MHz: the encrypted Adafruit IO connection sets up about twice as fast
monitor_speed = 115200
monitor_filters = esp8266_exception_decoder
lib_deps =
    fastled/FastLED@3.10.9
    knolleary/PubSubClient@^2.8

; Settings shared by every Wi-Fi (OTA) upload.
; OTA traffic: the PC sends an invitation to the lamp on UDP 8266, then the lamp
;   connects back to the PC on TCP 8270 (fixed here so a firewall rule can allow it).
; --auth sends the OTA password from the LIGHTBOX_OTA_PASSWORD environment
;   variable; it must match OTA_PASSWORD in secrets.h.
[ota]
upload_protocol = espota
upload_flags =
    --host_port=8270
    --auth=${sysenv.LIGHTBOX_OTA_PASSWORD}

; ---------------------------------------------------------------------------
; Lamp 1 - ESP-lightbox1
; ---------------------------------------------------------------------------
; Upload over USB
[env:d1_mini]
build_flags = -D LAMP_ID=1
upload_speed = 921600

; Upload over Wi-Fi. upload_port is the lamp's IP address (shown on its web
; page under Network). A .local name only works when the PC and the lamp are
; on the same network/VLAN.
[env:d1_mini_ota]
build_flags = -D LAMP_ID=1
upload_protocol = ${ota.upload_protocol}
upload_flags = ${ota.upload_flags}
upload_port = 192.168.30.30

; ---------------------------------------------------------------------------
; Lamp 2 - remove the ; at the start of these lines when you build a second
; lamp, fill in its settings block in config.h, and set its IP address.
; ---------------------------------------------------------------------------
;[env:lamp2_usb]
;build_flags = -D LAMP_ID=2
;upload_speed = 921600
;
;[env:lamp2_ota]
;build_flags = -D LAMP_ID=2
;upload_protocol = ${ota.upload_protocol}
;upload_flags = ${ota.upload_flags}
;upload_port = 192.168.30.31
